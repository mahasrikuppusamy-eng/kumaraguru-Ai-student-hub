<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Neural Circuit Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Core AI Brain / Cap Shield Glyph -->
  <g filter="url(#glow)">
    <!-- Graduation Cap / Diamond Geometric Crest -->
    <path d="M 256 120 L 400 196 L 256 272 L 112 196 Z" fill="url(#accent-grad)" opacity="0.95" />
    <path d="M 160 222 L 160 296 C 160 348, 352 348, 352 296 L 352 222 L 256 272 Z" fill="url(#glow-grad)" opacity="0.85" />
    
    <!-- Tassel / Node Connection -->
    <path d="M 384 204 L 384 290 C 384 300, 396 304, 396 312" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="396" cy="320" r="8" fill="#38bdf8" />
  </g>

  <!-- AI Neural Nodes & Pulse Dots -->
  <circle cx="256" cy="272" r="10" fill="#ffffff" />
  <circle cx="190" cy="300" r="6" fill="#38bdf8" />
  <circle cx="322" cy="300" r="6" fill="#c084fc" />
  <line x1="256" y1="272" x2="190" y2="300" stroke="#ffffff" stroke-width="2.5" opacity="0.7" />
  <line x1="256" y1="272" x2="322" y2="300" stroke="#ffffff" stroke-width="2.5" opacity="0.7" />

  <!-- Brand Subtext Acronym Badge -->
  <rect x="176" y="380" width="160" height="42" rx="21" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="2" />
  <text x="256" y="408" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="3">KCT AI</text>
</svg>
